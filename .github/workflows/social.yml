# Pubblica ogni giorno il post di Weblinkx (src/data/post.ts): a pranzo il
# video (Reel) su Instagram e sulla pagina Facebook, la sera il carosello
# (anche su LinkedIn, se collegato). Dopo il carosello legge le statistiche
# dei post usciti e aggiorna l'analisi (social/analisi.md).
# Come collegare i social: social/README.md. Un social senza credenziali
# viene saltato.
name: Post social di Weblinkx

on:
  schedule:
    # Ogni ora, non all'ora esatta: GitHub ritarda gli orari programmati anche
    # di ore, o li salta. Il primo passo decide se è il momento (video dalle
    # 12 svizzere, carosello dalle 19, scripts/social/turno.ts) e, se il post
    # è già uscito, social/storico.json lo dice e l'esecuzione non fa nulla.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      formato:
        description: "Carosello di immagini o video (Reel); auto: decide l'ora, come lo schedule"
        type: choice
        options:
          - carosello
          - video
          - auto
        default: carosello
      data:
        description: "Giorno del post (AAAA-MM-GG). Vuoto: oggi."
        required: false
      piattaforme:
        description: "Social, separati da virgole"
        required: false
        default: "instagram,facebook,linkedin"
      prova:
        description: "Solo prova: mostra testi e immagini senza pubblicare"
        type: boolean
        default: true
      ripubblica:
        description: "Ripubblica i post di quel giorno cancellati a mano dal social"
        type: boolean
        default: false

permissions:
  # Per salvare registro, statistiche e analisi nel repository.
  contents: write

concurrency:
  group: post-social
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # L'ultima versione del branch, non quella di quando è partito il
      # workflow: così un'esecuzione in coda vede il registro aggiornato da
      # quella prima e non pubblica due volte.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            video/package-lock.json
      - run: npm ci

      # A mano si sceglie il formato; dallo schedule e con «auto» lo decide
      # turno.ts. Senza social collegati non c'è niente da fare.
      - name: Cosa pubblicare
        id: turno
        run: |
          if [ -n "${{ inputs.formato }}" ] && [ "${{ inputs.formato }}" != "auto" ]; then echo "formato=${{ inputs.formato }}" >> "$GITHUB_OUTPUT"; else npm run -s social:turno; fi
        env:
          HA_META: ${{ secrets.META_PAGE_TOKEN != '' }}
          HA_LINKEDIN: ${{ secrets.LINKEDIN_TOKEN != '' }}

      # Il video lo fa Remotion (video/scripts/reel.ts): servono ffmpeg e
      # Python con NumPy per la musica. Niente apt: il mirror di Ubuntu a
      # volte impiega più di un quarto d'ora per ffmpeg; da GitHub e da PyPI
      # bastano pochi secondi.
      - name: Python per il video
        if: steps.turno.outputs.formato == 'video'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti per il video
        if: steps.turno.outputs.formato == 'video'
        timeout-minutes: 8
        run: |
          pip install -q numpy
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sSfL --retry 3 "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz" | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Fai il video
        if: steps.turno.outputs.formato == 'video'
        working-directory: video
        run: |
          npm ci
          npm run reel
        env:
          SOCIAL_DATA: ${{ inputs.data }}
      # Il video resta scaricabile per due settimane (per esempio per TikTok).
      - name: Conserva il video
        if: steps.turno.outputs.formato == 'video'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.data || github.run_id }}
          path: video/out/reel-*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - id: pubblica
        if: steps.turno.outputs.formato != 'niente'
        run: npm run social:pubblica
        env:
          SOCIAL_FORMATO: ${{ steps.turno.outputs.formato }}
          SOCIAL_DATA: ${{ inputs.data }}
          SOCIAL_PIATTAFORME: ${{ inputs.piattaforme }}
          SOCIAL_PROVA: ${{ inputs.prova }}
          SOCIAL_RIPUBBLICA: ${{ inputs.ripubblica }}
          # Il sito per i link nei post; la variabile SITO_URL lo cambia.
          SITO_URL: ${{ vars.SITO_URL || 'https://weblinkx.ch' }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}

      # Una volta al giorno, dopo il carosello. Se le statistiche non si
      # possono leggere (per esempio mancano i permessi) il post resta
      # pubblicato: il problema si vede nel riassunto del workflow.
      - name: Statistiche e analisi
        if: always() && steps.turno.outputs.formato == 'carosello' && inputs.prova != true && steps.pubblica.outcome != 'skipped'
        continue-on-error: true
        run: npm run social:statistiche
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}

      # Registro, statistiche e analisi restano nel repository: il registro
      # evita di ripubblicare lo stesso post, statistiche e analisi servono
      # per i post nuovi. Anche se un social ha dato errore, gli altri
      # pubblicati vanno registrati.
      - name: Salva registro e statistiche
        if: always() && steps.pubblica.outcome != 'skipped'
        run: |
          git add social/storico.json social/statistiche.json social/analisi.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Social: registro e statistiche"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
